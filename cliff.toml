# git-cliff drafts the CHANGELOG.md section for a release from commit subjects
# (`<type>(<scope>): <ID>[ <ID>…] <summary>`), grouped by tracker series. A maintainer then
# rewrites the draft in words a lab owner understands (docs/dev/releasing.md).
#
#   git cliff --unreleased --tag v0.1.0

[changelog]
header = ""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | split(pat=": ") | slice(start=1) | join(sep=": ") | trim }}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!?: (M|X|LT)[0-9]", group = "<!-- 1 -->Features" },
  { message = "^[a-z]+(\\([^)]*\\))?!?: EC-", group = "<!-- 2 -->Readiness (security, operations, compliance)" },
  { message = "^[a-z]+(\\([^)]*\\))?!?: W[0-9]", group = "<!-- 3 -->Project and tooling" },
  { message = ".*", skip = true },
]
