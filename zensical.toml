# Documentation site, built with `uv run zensical build --strict` (scripts/ci_local.sh, docs stage).
# Every page under docs/ must be in `nav`; scripts/check_docs_linked.py fails otherwise.
# Pages whose name starts with `_` are templates and are left out.

[project]
site_name = "Labra"
site_description = "Open-source software for small Indian diagnostic lab chains"
site_url = "https://premdon009.github.io/labra/"
repo_url = "https://github.com/premdon009/labra"
docs_dir = "docs"
site_dir = "site"
exclude_docs = """
_*.md
"""
nav = [
  { "Home" = "index.md" },
  { "User manual" = [
    "manual/index.md",
    { "Getting started" = [
      "manual/getting-started/login.md",
      "manual/getting-started/screen-layout.md",
      "manual/getting-started/keyboard-shortcuts.md",
    ] },
    { "Admin" = [
      "manual/admin/branches.md",
      "manual/admin/users-and-roles.md",
      "manual/admin/settings.md",
      "manual/admin/currency.md",
      "manual/admin/catalog.md",
      "manual/admin/reference-ranges.md",
      "manual/admin/methods.md",
      "manual/admin/prices.md",
      "manual/admin/external-labs.md",
      "manual/admin/letterhead-and-margins.md",
      "manual/admin/starter-catalog.md",
      "manual/admin/data-export.md",
    ] },
    { "Front desk" = [
      "manual/frontdesk/new-visit.md",
      "manual/frontdesk/find-patient.md",
      "manual/frontdesk/patient-history.md",
      "manual/frontdesk/referrers.md",
      "manual/frontdesk/labels.md",
      "manual/frontdesk/bills-and-receipts.md",
      "manual/frontdesk/dues-and-payments.md",
    ] },
    { "Lab" = [
      "manual/lab/receiving-samples.md",
      "manual/lab/worklist.md",
      "manual/lab/entering-results.md",
      "manual/lab/critical-values.md",
      "manual/lab/outsourcing.md",
      "manual/lab/calculated-values.md",
    ] },
    { "Reports" = [
      "manual/reports/releasing.md",
      "manual/reports/amended.md",
      "manual/reports/options.md",
      "manual/reports/print-vs-digital.md",
      "manual/reports/delivery.md",
    ] },
    { "Owner" = [
      "manual/owner/daily-collection.md",
      "manual/owner/dues-pending-outsourcing.md",
    ] },
  ] },
  { "Developers" = [
    "dev/setup.md",
    "dev/workflow.md",
    "dev/running-the-stack.md",
    "dev/runtimes.md",
    "dev/services.md",
    "dev/releasing.md",
    "dev/tooling-issues.md",
    "DEPENDENCIES.md",
  ] },
  { "Decisions" = [
    "adr/index.md",
    "adr/0001-record-decisions.md",
    "adr/0002-licence-mit.md",
    "adr/0003-fastapi-postgres.md",
    "adr/0004-small-server-hosting.md",
    "adr/0005-medical-standards.md",
    "adr/0006-customisation-model.md",
    "adr/0007-replaceable-edges.md",
    "adr/0008-platform-ports.md",
    "adr/0009-runtime-neutral-packaging.md",
    "adr/0010-own-admin-screens.md",
    "adr/0011-svg-stdlib-parser.md",
    "adr/0012-pdf-engine.md",
    "adr/0013-backup-runner.md",
  ] },
  { "Plan and progress" = [
    "design/v1-plan.md",
    "TRACKER.md",
    "ENTERPRISE_CHECKLIST.md",
    "compliance/COMPLIANCE_CHECKLIST.md",
  ] },
  { "Background research" = [
    "research/india-lab-regulations.md",
    "research/oss-lims-landscape.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
