[project]
name = "labra"
version = "0.1.0.dev0"
description = "Open-source software for small diagnostic lab chains"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "babel>=2.18",
    "defusedxml>=0.7",
    "duckdb>=1.5",
    "fastapi>=0.142",
    "jinja2>=3.1.6",
    "pillow>=12.3",
    "prometheus-client>=0.23",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "pypdf>=6.19",
    "pypdfium2>=5.14",
    "python-barcode>=0.16",
    "python-multipart>=0.0.32",
    "segno>=1.6",
    "sqlalchemy>=2.1",
    "structlog>=26.1",
    "uvicorn>=0.54",
    "weasyprint>=70",
]

[project.optional-dependencies]
seed = ["faker>=40"]

[project.urls]
Homepage = "https://github.com/premdon009/labra"
Issues = "https://github.com/premdon009/labra/issues"
Changelog = "https://github.com/premdon009/labra/blob/master/CHANGELOG.md"

[project.scripts]
labra = "labra.cli:main"

# Built-in adapters for the platform ports (ADR-0008). Third-party adapters register here too.
[project.entry-points."labra.identity"]
local = "labra.adapters.identity_local:LocalIdentity"

[project.entry-points."labra.filestore"]
local = "labra.adapters.filestore_local:LocalFileStore"

[project.entry-points."labra.errors"]
log = "labra.adapters.errors_log:LogErrorReporter"

[project.entry-points."labra.heartbeat"]
log = "labra.adapters.heartbeat:LogHeartbeat"
http = "labra.adapters.heartbeat:HttpHeartbeat"

[project.entry-points."labra.mailer"]
console = "labra.adapters.mailer:ConsoleMailer"
smtp = "labra.adapters.mailer:SmtpMailer"

[dependency-groups]
dev = [
    "faker>=40",
    "httpx2>=2.13.1",
    "hypothesis>=6.168",
    "import-linter>=2.5",
    "pdfplumber>=0.11",
    "pip-audit>=2.9",
    "playwright>=1.56",
    "pre-commit>=4.3",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "pytest-cov>=7",
    "pytest-rerunfailures>=16.7",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15",
    "zensical>=0.0.68",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "labra/CHANGELOG.md"

[tool.uv]
# Minimum release age: lock only releases at least 7 days old. A critical fix goes in
# exclude-newer-package with an Age exceptions row in docs/DEPENDENCIES.md.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "S", "SIM", "RUF",
    "PTH", "BLE", "DTZ", "T20", "C4", "RET", "N", "C90", "TRY400",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["T201", "S603", "S607"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "item(id): tracker ID this test proves",
    "db: needs Postgres (Docker); skipped with a reason when Docker isn't reachable",
    "e2e: drives a real browser; skipped with a reason when Chromium isn't installed",
]
addopts = "--strict-markers"
# Deprecations in the libraries Labra leans on hardest fail the test that hits them, so a
# replacement is made before the next major version removes the old call.
filterwarnings = [
    "error::sqlalchemy.exc.SADeprecationWarning",
    "error:.*pypdf:DeprecationWarning",
]

[tool.coverage.run]
source = ["labra"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
# Raised as code lands; never lowered. Per-module targets are in scripts/coverage_targets.toml.
fail_under = 70

[tool.importlinter]
root_package = "labra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain code reaches platform services through ports only"
type = "forbidden"
source_modules = [
    "labra.core",
    "labra.auth",
    "labra.org",
    "labra.catalog",
    "labra.patients",
    "labra.visits",
    "labra.billing",
    "labra.extlabs",
    "labra.results",
    "labra.printing",
    "labra.reports",
    "labra.owner",
    "labra.exports",
]
forbidden_modules = ["labra.adapters", "structlog", "prometheus_client", "argon2", "smtplib"]
ignore_imports = [
    "labra.core.logging -> structlog",
    "labra.core.metrics -> prometheus_client",
    # The full export lists every table, the local identity adapter's included (it leaves
    # the password hashes out).
    "labra.exports.full -> labra.models",
]

[[tool.importlinter.contracts]]
name = "Adapters don't depend on domain modules"
type = "forbidden"
source_modules = ["labra.adapters"]
forbidden_modules = [
    "labra.auth",
    "labra.org",
    "labra.catalog",
    "labra.patients",
    "labra.visits",
    "labra.billing",
    "labra.extlabs",
    "labra.results",
    "labra.printing",
    "labra.reports",
    "labra.owner",
    "labra.exports",
    "labra.web",
]

[[tool.importlinter.contracts]]
name = "Feature module layers"
type = "layers"
containers = [
    "labra.auth",
    "labra.org",
    "labra.catalog",
    "labra.patients",
    "labra.visits",
    "labra.billing",
    "labra.extlabs",
    "labra.results",
    "labra.printing",
    "labra.reports",
]
layers = ["routes", "service", "models"]

[[tool.importlinter.contracts]]
name = "Owner figure layers (no tables of its own)"
type = "layers"
containers = ["labra.owner"]
layers = ["routes", "service"]

[[tool.importlinter.contracts]]
name = "The front desk and external labs don't depend on the lab bench"
type = "forbidden"
source_modules = ["labra.patients", "labra.visits", "labra.billing", "labra.extlabs"]
forbidden_modules = ["labra.results"]

[[tool.importlinter.contracts]]
name = "The front desk doesn't depend on external labs"
type = "forbidden"
source_modules = ["labra.patients", "labra.visits", "labra.billing"]
forbidden_modules = ["labra.extlabs"]

[[tool.importlinter.contracts]]
name = "Reports sit on top: the front desk, external labs and the bench don't depend on them"
type = "forbidden"
source_modules = [
    "labra.patients",
    "labra.visits",
    "labra.billing",
    "labra.extlabs",
    "labra.results",
]
forbidden_modules = ["labra.reports"]

[[tool.importlinter.contracts]]
name = "The owner's figures sit on top: nothing else depends on them"
type = "forbidden"
source_modules = [
    "labra.patients",
    "labra.visits",
    "labra.billing",
    "labra.extlabs",
    "labra.results",
    "labra.printing",
    "labra.reports",
]
forbidden_modules = ["labra.owner"]

[[tool.importlinter.contracts]]
name = "Exports run from the command line only: no screen or domain module reaches them"
type = "forbidden"
source_modules = [
    "labra.core",
    "labra.auth",
    "labra.org",
    "labra.catalog",
    "labra.patients",
    "labra.visits",
    "labra.billing",
    "labra.extlabs",
    "labra.results",
    "labra.printing",
    "labra.reports",
    "labra.owner",
    "labra.web",
    "labra.app",
]
forbidden_modules = ["labra.exports"]

[[tool.importlinter.contracts]]
name = "Parquet files are written only by the full data export"
type = "protected"
protected_modules = ["duckdb"]
allowed_importers = ["labra.exports.full"]

[[tool.importlinter.contracts]]
name = "PDF, image and QR libraries are used only in the printing package"
type = "protected"
protected_modules = ["weasyprint", "pypdf", "pypdfium2", "PIL", "segno"]
allowed_importers = ["labra.printing"]

[[tool.importlinter.contracts]]
name = "Untrusted XML is parsed only by the SVG sanitiser"
type = "protected"
protected_modules = ["defusedxml"]
allowed_importers = ["labra.core.svg"]

[[tool.importlinter.contracts]]
name = "The printing package knows nothing of patients, visits, bills or results"
type = "forbidden"
source_modules = ["labra.printing"]
forbidden_modules = [
    "labra.catalog",
    "labra.patients",
    "labra.visits",
    "labra.billing",
    "labra.extlabs",
    "labra.results",
]

[[tool.importlinter.contracts]]
name = "Front-desk domain code leaves formatting to the web layer"
type = "forbidden"
source_modules = [
    "labra.patients.models",
    "labra.patients.service",
    "labra.visits.models",
    "labra.visits.labels",
    "labra.visits.service",
    "labra.billing.models",
    "labra.billing.service",
]
forbidden_modules = ["labra.web"]
