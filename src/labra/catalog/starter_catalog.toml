name = "Hepatitis B surface antigen (HBsAg)"
type = "option"
options = "reactive"

[parameters.HCV_SCO]
name = "HCV antibody index"
unit = "{s_co_ratio}"
decimals = 2
absurd = [0, 100]
ranges = [{ high = 0.99, display = "Non-reactive below 1.00; reactive at 1.00 or more", cite = "cutoff" }]

[parameters.HCV]
name = "Hepatitis C virus antibody"
type = "option"
options = "reactive"

[parameters.VDRL]
name = "VDRL"
type = "option"
options = "reactive"

[parameters.TO]
name = "S. Typhi O antigen"
type = "option"
options = "widal_o"

[parameters.TH]
name = "S. Typhi H antigen"
type = "option"
options = "widal_h"

[parameters.AH]
name = "S. Paratyphi AH antigen"
type = "option"
options = "widal_h"

[parameters.BH]
name = "S. Paratyphi BH antigen"
type = "option"
options = "widal_h"

[parameters.NS1]
name = "Dengue NS1 antigen"
type = "option"
options = "dengue"

[parameters.DENG_IGM]
name = "Dengue IgM antibody"
type = "option"
options = "dengue"

[parameters.DENG_IGG]
name = "Dengue IgG antibody"
type = "option"
options = "dengue"

# General examination

[parameters.HT]
name = "Height"
unit = "cm"
decimals = 1

[parameters.WT]
name = "Weight"
unit = "kg"
decimals = 1

[parameters.BMI]
name = "Body mass index (BMI)"
type = "calculated"
unit = "kg/m2"
decimals = 1
formula = "WT / (HT / 100) ** 2"

[parameters.BP]
name = "Blood pressure"
type = "text"
unit = "mm[Hg]"
pattern = '^\d{2,3}/\d{2,3}$'

[parameters.INDUR]
name = "Induration after 48 to 72 hours"
unit = "mm"
decimals = 0

[parameters.MANTOUX]
name = "Mantoux result"
type = "option"
options = "neg_pos"

