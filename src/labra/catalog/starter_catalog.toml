department = "General Examination"
tat_hours = 72
methods = ["Intradermal tuberculin (Mantoux)"]
parameters = ["INDUR", "MANTOUX"]
interpretation = "Read 48 to 72 hours after injection. Induration (not redness) of 10 mm or more is usually taken as positive; lower cut-offs apply to people with HIV or other immune suppression. A positive test shows past or present infection, not active disease."

