# Haematology

[parameters.HB]
name = "Haemoglobin"
unit = "g/dL"
decimals = 1
absurd = [1, 25]
ranges = [
  { sex = "M", low = 13.0, high = 17.0, cite = "hb" },
  { sex = "F", low = 12.0, high = 15.0, cite = "hb" },
]

[parameters.RBC]
name = "RBC count"
unit = "10*6/uL"
decimals = 2
absurd = [0.5, 10]
ranges = [
  { sex = "M", low = 4.5, high = 5.5, cite = "dacie" },
  { sex = "F", low = 3.8, high = 4.8, cite = "dacie" },
]

[parameters.PCV]
name = "Packed cell volume (PCV)"
unit = "%"
decimals = 1
absurd = [5, 75]
ranges = [
  { sex = "M", low = 40, high = 50, cite = "dacie" },
  { sex = "F", low = 36, high = 46, cite = "dacie" },
]

[parameters.MCV]
name = "Mean corpuscular volume (MCV)"
unit = "fL"
decimals = 1
absurd = [40, 150]
ranges = [{ low = 83, high = 101, cite = "dacie" }]

[parameters.MCH]
name = "Mean corpuscular haemoglobin (MCH)"
unit = "pg"
decimals = 1
absurd = [10, 60]
ranges = [{ low = 27, high = 32, cite = "dacie" }]

[parameters.MCHC]
name = "Mean corpuscular haemoglobin concentration (MCHC)"
unit = "g/dL"
decimals = 1
absurd = [20, 45]
ranges = [{ low = 31.5, high = 34.5, cite = "dacie" }]

[parameters.WBC]
name = "Total WBC count"
unit = "/uL"
decimals = 0
absurd = [100, 500000]
ranges = [{ low = 4000, high = 10000, cite = "dacie" }]

[parameters.NEUT]
name = "Neutrophils"
unit = "%"
decimals = 0
absurd = [0, 100]
ranges = [{ low = 40, high = 80, cite = "dacie" }]

[parameters.LYMPH]
name = "Lymphocytes"
unit = "%"
decimals = 0
absurd = [0, 100]
ranges = [{ low = 20, high = 40, cite = "dacie" }]

[parameters.EOS]
name = "Eosinophils"
unit = "%"
decimals = 0
absurd = [0, 100]
ranges = [{ low = 1, high = 6, cite = "dacie" }]

[parameters.MONO]
name = "Monocytes"
unit = "%"
decimals = 0
absurd = [0, 100]
ranges = [{ low = 2, high = 10, cite = "dacie" }]

[parameters.BASO]
name = "Basophils"
unit = "%"
decimals = 0
absurd = [0, 100]
ranges = [{ low = 0, high = 2, cite = "dacie" }]

[parameters.PLT]
name = "Platelet count"
unit = "10*5/uL"
decimals = 2
