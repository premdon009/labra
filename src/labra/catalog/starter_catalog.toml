# Labra starter catalog: common tests with units, adult reference ranges and specimen types.
#
# Every range is imported unapproved. The lab's pathologist checks each one against the lab's own
# kit insert or analyser and approves it before reports can be released (design §1d). Prices are
# not included; each lab sets its own.
#
# Layout:
#   [citations]      key → the source a range was taken from
#   [option_sets]    key → the choices of an option parameter; abnormal ones are flagged
#   [parameters.X]   one parameter, reused by every test that lists code X
#   [[departments]], [[specimens]], [[tests]], [[packages]]
#
# Ranges are adult (18 years and over) unless they give `age_days`. Absurd limits catch typing
# mistakes (an Hb of 135 instead of 13.5); critical limits are left to the lab's own policy.

[citations]
dacie = "Bain BJ, Bates I, Laffan MA. Dacie and Lewis Practical Haematology, 12th ed. Elsevier, 2017: adult reference ranges. Replace with your analyser's verified range."
hb = "Dacie and Lewis Practical Haematology, 12th ed. (2017); lower limits match the WHO 2011 anaemia cut-offs (WHO/NMH/NHD/MNM/11.1): 13 g/dL men, 12 g/dL non-pregnant women."
ada = "American Diabetes Association. Standards of Care in Diabetes, section 2: Diagnosis and Classification of Diabetes (current edition)."
ncep = "NCEP Expert Panel. Executive summary of the Third Report (Adult Treatment Panel III). JAMA 2001;285:2486-97."
friedewald = "Friedewald WT, Levy RI, Fredrickson DS. Clin Chem 1972;18:499-502. Not valid when triglycerides are 400 mg/dL or more."
adag = "Nathan DM et al. Translating the A1C assay into estimated average glucose values. Diabetes Care 2008;31:1473-8."
ata = "Stagnaro-Green A et al. ATA guidelines for thyroid disease during pregnancy and postpartum. Thyroid 2011;21:1081-125. The 2017 update prefers trimester ranges from your own population and kit."
texts = "Typical adult interval from standard laboratory medicine texts. Replace with the range on your kit insert."
cutoff = "Kit-defined cut-off index (sample signal / cut-off). Confirm against your kit insert."

