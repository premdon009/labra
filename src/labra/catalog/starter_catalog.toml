# Glucose and HbA1c

[parameters.GLUF]
name = "Glucose, fasting"
unit = "mg/dL"
decimals = 0
absurd = [10, 1500]

[[parameters.GLUF.ranges]]
low = 70
high = 99
cite = "ada"
bands = [
  { low = 70, high = 99, label = "Normal", severity = "normal" },
  { low = 100, high = 125, label = "Prediabetes", severity = "borderline" },
  { low = 126, label = "Diabetes range", severity = "abnormal" },
]

[parameters.GLUPP]
name = "Glucose, post-prandial (2 hours)"
unit = "mg/dL"
decimals = 0
absurd = [10, 1500]
ranges = [{ low = 70, high = 139, cite = "texts" }]

[parameters.GLUR]
name = "Glucose, random"
unit = "mg/dL"
decimals = 0
absurd = [10, 1500]
ranges = [{ low = 70, high = 139, cite = "texts" }]

[parameters.GLU1H]
name = "Glucose, 1 hour"
unit = "mg/dL"
decimals = 0

[parameters.GLU2H]
name = "Glucose, 2 hours"
unit = "mg/dL"
decimals = 0
absurd = [10, 1500]

[[parameters.GLU2H.ranges]]
high = 139
cite = "ada"
bands = [
  { high = 139, label = "Normal", severity = "normal" },
  { low = 140, high = 199, label = "Impaired glucose tolerance", severity = "borderline" },
  { low = 200, label = "Diabetes range", severity = "abnormal" },
]

[parameters.UGLU0]
name = "Urine glucose, fasting"
type = "option"
options = "urine_grade"

[parameters.UGLU1]
name = "Urine glucose, 1 hour"
type = "option"
options = "urine_grade"

[parameters.UGLU2]
name = "Urine glucose, 2 hours"
type = "option"
options = "urine_grade"

[parameters.A1C]
name = "HbA1c"
unit = "%"
decimals = 1
absurd = [2, 20]

[[parameters.A1C.ranges]]
high = 5.6
cite = "ada"
bands = [
  { high = 5.6, label = "Normal", severity = "normal" },
  { low = 5.7, high = 6.4, label = "Prediabetes", severity = "borderline" },
  { low = 6.5, label = "Diabetes range", severity = "abnormal" },
]

[parameters.EAG]
name = "Estimated average glucose"
type = "calculated"
unit = "mg/dL"
decimals = 0
formula = "28.7 * A1C - 46.7"

# Lipids

[parameters.TC]
name = "Total cholesterol"
unit = "mg/dL"
decimals = 0
absurd = [20, 1500]

[[parameters.TC.ranges]]
high = 199
cite = "ncep"
bands = [
  { high = 199, label = "Desirable", severity = "normal" },
  { low = 200, high = 239, label = "Borderline high", severity = "borderline" },
  { low = 240, label = "High", severity = "abnormal" },
]

[parameters.TG]
name = "Triglycerides"
unit = "mg/dL"
decimals = 0
absurd = [10, 10000]

[[parameters.TG.ranges]]
high = 149
cite = "ncep"
bands = [
  { high = 149, label = "Normal", severity = "normal" },
  { low = 150, high = 199, label = "Borderline high", severity = "borderline" },
  { low = 200, high = 499, label = "High", severity = "abnormal" },
  { low = 500, label = "Very high", severity = "abnormal" },
]

[parameters.HDL]
name = "HDL cholesterol"
unit = "mg/dL"
decimals = 0
absurd = [2, 250]

[[parameters.HDL.ranges]]
low = 40
cite = "ncep"
bands = [
  { high = 39, label = "Low", severity = "abnormal" },
  { low = 40, high = 59, label = "Normal", severity = "normal" },
  { low = 60, label = "High (protective)", severity = "normal" },
]

[parameters.VLDL]
name = "VLDL cholesterol"
type = "calculated"
unit = "mg/dL"
decimals = 0
formula = "TG / 5"
valid_if = "TG < 400"

[parameters.LDL]
name = "LDL cholesterol"
type = "calculated"
unit = "mg/dL"
decimals = 0
formula = "TC - HDL - TG / 5"
valid_if = "TG < 400"

[[parameters.LDL.ranges]]
high = 99
cite = "ncep"
bands = [
  { high = 99, label = "Optimal", severity = "normal" },
  { low = 100, high = 129, label = "Near optimal", severity = "borderline" },
  { low = 130, high = 159, label = "Borderline high", severity = "borderline" },
  { low = 160, high = 189, label = "High", severity = "abnormal" },
  { low = 190, label = "Very high", severity = "abnormal" },
]

[parameters.NONHDL]
name = "Non-HDL cholesterol"
type = "calculated"
unit = "mg/dL"
decimals = 0
formula = "TC - HDL"
ranges = [{ high = 129, cite = "ncep" }]

[parameters.TC_HDL]
name = "Total cholesterol / HDL ratio"
type = "calculated"
unit = "{ratio}"
decimals = 1
formula = "TC / HDL"

[parameters.LDL_HDL]
name = "LDL / HDL ratio"
type = "calculated"
unit = "{ratio}"
decimals = 1
formula = "LDL / HDL"
valid_if = "TG < 400"

