{% extends "base.html" %}
{% block title %}{{ status }}{% endblock %}
{% block content %}
<div class="card">
  <header><h1>{{ message }}</h1></header>
  <section class="stack">
    {% if reference %}
    <p>Reference: <strong>{{ reference }}</strong></p>
    {% endif %}
    <p><a class="btn-outline" href="/">Go to the home page</a></p>
  </section>
</div>
{% endblock %}
