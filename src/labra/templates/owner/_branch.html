{% if branches|length > 1 %}
<div class="field-row"><label class="label" for="f-branch">Branch</label>
  <select class="select" id="f-branch" name="branch">
    <option value="">All my branches</option>
    {% for b in branches %}<option value="{{ b.id }}" {% if branch == b.id|string %}selected{% endif %}>{{ b.name }}</option>{% endfor %}
  </select>
</div>
{% endif %}
