# The Labra stack for one main lab: web, Postgres and a reverse proxy (Caddy), plus a tunnel for
# branches under a profile: cloudflared (`tunnel`), Tailscale (`tailscale`) or NetBird
# (`netbird`). Images are pinned by digest and fully qualified, so Docker, Podman and nerdctl
# all resolve them the same way (scripts/audit_deps.py --check).
#
#   docker compose up -d                        LAN only
#   docker compose --profile tunnel up -d       with the Cloudflare tunnel
#   docker compose --profile tailscale up -d    with Tailscale or Headscale instead
#   docker compose --profile netbird up -d      with NetBird (cloud or self-hosted) instead
#   docker compose -f compose.yaml -f deploy/nginx/compose.nginx.yaml up -d    nginx, not Caddy
#   docker compose --profile jobs run --rm backup backup    one backup (host timers run this)
#   scripts/restore.sh, scripts/drill.sh        a restore, the monthly drill (the restore service)
#
# `podman compose` and `nerdctl compose` take the same arguments (docs/dev/runtimes.md).
# Secrets are files in ${LABRA_SECRETS_DIR:-./secrets}/ (never committed).
# Setup and backups: docs/dev/running-the-stack.md.

name: labra

# Every long-running container keeps at most five 10 MB log files, whatever the engine's
# default, so logs can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Web logs in to the database as a user that reads and writes rows only (database_url). Migrate
# logs in as the owner, and gives web and the backup job their users (src/labra/core/dbroles.py).
x-labra-env: &labra-env
  LABRA_DATABASE_URL_FILE: /run/secrets/database_url
  LABRA_FILES_DIR: /data/files
  LABRA_EXPORT_DIR: /data/export
  LABRA_MAILER: ${LABRA_MAILER:-console}
  # The System page reads the HTTPS certificate's expiry from the proxy, by the LAN name.
  LABRA_CERT_CHECK_HOST: ${LABRA_CERT_CHECK_HOST-proxy:443}
  LABRA_CERT_CHECK_NAME: ${LABRA_SITE:-labra.lan}

# Web and migrate run as uid 10001 with no capabilities, can't gain privileges, and write only
# to their volumes and a /tmp held in memory (WeasyPrint's font cache).
# `no-new-privileges` without `:true`, which nerdctl compose ignores.
x-labra: &labra
  image: ${LABRA_IMAGE:-ghcr.io/premdon009/labra:0.1.0}
  build: .
  environment: *labra-env
  secrets: [database_url]
  volumes:
    - files:/data/files
    - exports:/data/export
  networks: [db]
  logging: *logging
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges]

# web, db and proxy are held to a 4 GB, 2 CPU laptop between them (design §1a): 2 GB and one
# CPU, 1.5 GB and 0.75, 512 MB and 0.25. On a bigger server raise them with the LABRA_*_MEMORY
# and LABRA_*_CPUS settings (docs/dev/running-the-stack.md).

services:
  db:
    image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    # Sized for a 4 GB laptop (design §1a).
    command: >-
      postgres -c shared_buffers=256MB -c max_connections=30 -c effective_cache_size=1GB
      -c work_mem=8MB -c maintenance_work_mem=64MB -c wal_compression=on
    environment:
      POSTGRES_USER: labra
      POSTGRES_DB: labra
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [db]
    mem_limit: ${LABRA_DB_MEMORY:-1536m}
    cpus: ${LABRA_DB_CPUS:-0.75}
    pids_limit: 256
    # The image starts as root to set up its data folder, then runs Postgres as its own user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "labra", "-d", "labra"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  migrate:
    <<: *labra
    command: ["labra", "migrate"]
    restart: "no"
    environment:
      <<: *labra-env
      LABRA_DATABASE_URL_FILE: /run/secrets/owner_database_url
      LABRA_APP_DATABASE_URL_FILE: /run/secrets/database_url
      LABRA_BACKUP_DATABASE_URL_FILE: /run/secrets/backup_database_url
    secrets: [owner_database_url, database_url, backup_database_url]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *labra
    restart: unless-stopped
    # Trust X-Forwarded-For only from the edge network, where the proxy is.
    command:
      - labra
      - serve
      - --host=0.0.0.0
      - --port=8000
      - --workers=2
      - --forwarded-allow-ips=${LABRA_EDGE_SUBNET:-172.30.0.0/24}
    networks: [db, edge]
    mem_limit: ${LABRA_WEB_MEMORY:-2g}
    cpus: ${LABRA_WEB_CPUS:-1}
    pids_limit: 256
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "labra.probe", "/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    image: docker.io/library/caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    # Rootless Podman and nerdctl can't publish ports below 1024 by default; set these to
    # 8080/8443, or lower net.ipv4.ip_unprivileged_port_start (docs/dev/runtimes.md).
    ports:
      - "${LABRA_HTTP_PORT:-80}:80"
      - "${LABRA_HTTPS_PORT:-443}:443"
    environment:
      LABRA_SITE: ${LABRA_SITE:-labra.lan}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, public]
    mem_limit: ${LABRA_PROXY_MEMORY:-512m}
    cpus: ${LABRA_PROXY_CPUS:-0.25}
    pids_limit: 256
    # Root inside the container, with only the right to listen on ports 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges]
    logging: *logging
    depends_on:
      web:
        condition: service_healthy

  tunnel:
    image: docker.io/cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    profiles: [tunnel]
    restart: unless-stopped
    # Point the tunnel's public hostname at http://proxy:8080 in the Cloudflare dashboard.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${LABRA_TUNNEL_TOKEN:-}
    networks: [public]
    logging: *logging
    depends_on: [proxy]

  # Branches reach the proxy's HTTPS port over the tailnet, under the same name and certificate
  # as LAN PCs. Userspace networking needs no tun device or extra privileges, so it runs
  # rootless too. For self-hosted Headscale, set LABRA_TAILSCALE_ARGS=--login-server=https://…
  tailscale:
    image: docker.io/tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    profiles: [tailscale]
    restart: unless-stopped
    hostname: ${LABRA_TAILSCALE_HOSTNAME:-labra}
    environment:
      TS_AUTHKEY: ${LABRA_TAILSCALE_AUTHKEY:-}
      TS_EXTRA_ARGS: ${LABRA_TAILSCALE_ARGS:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
      - tailscale_state:/var/lib/tailscale
    networks: [public]
    logging: *logging
    depends_on: [proxy]

  # NetBird: the same idea with a control plane that can be fully self-hosted. It shares the
  # proxy's network, so peers reach the proxy's HTTPS port at this peer's NetBird address;
  # give labra.lan that address in NetBird's DNS. Needs a tun device and NET_ADMIN.
  netbird:
    image: docker.io/netbirdio/netbird:0.80.0@sha256:4976692ea44bb93871743d0b742b4a8f97f6425bfc458ca2d78e28fdb8bdf4ad
    profiles: [netbird]
    restart: unless-stopped
    network_mode: service:proxy
    cap_add: [NET_ADMIN, SYS_RESOURCE]
    devices: [/dev/net/tun]
    environment:
      NB_SETUP_KEY: ${LABRA_NETBIRD_SETUP_KEY:-}
      NB_MANAGEMENT_URL: ${LABRA_NETBIRD_MANAGEMENT_URL:-https://api.netbird.io}
      NB_HOSTNAME: ${LABRA_NETBIRD_HOSTNAME:-labra}
    volumes:
      - netbird_state:/var/lib/netbird
    logging: *logging
    depends_on: [proxy]

  # One-shot jobs: backups, the restore drill, the watchdog (ADR-0013). Under a profile, so
  # `up -d` never starts it; the host timers from scripts/install_timers.sh run it and it exits.
  backup: &backup
    image: ${LABRA_BACKUP_IMAGE:-ghcr.io/premdon009/labra-backup:0.1.0}
    build: deploy/backup
    profiles: [jobs]
    restart: "no"
    environment: &backup-env
      # A user that reads everything and writes only the run log.
      LABRA_DATABASE_URL_FILE: /run/secrets/backup_database_url
      LABRA_BACKUP_REPO_DRIVE: ${LABRA_BACKUP_REPO_DRIVE:-}
      LABRA_BACKUP_REPO_USB: ${LABRA_BACKUP_REPO_USB:-}
      LABRA_HEARTBEAT_URL_BACKUP: ${LABRA_HEARTBEAT_URL_BACKUP:-}
      LABRA_HEARTBEAT_URL_DRILL: ${LABRA_HEARTBEAT_URL_DRILL:-}
      LABRA_HEARTBEAT_URL_WATCHDOG: ${LABRA_HEARTBEAT_URL_WATCHDOG:-}
      # The nightly audit check and the disk alert run in web, which has no way to the internet;
      # scripts/labra.sh passes their result to `labra-backup ping`. Empty is unset.
      LABRA_HEARTBEAT_URL_AUDIT_VERIFY: ${LABRA_HEARTBEAT_URL_AUDIT_VERIFY:-}
      LABRA_HEARTBEAT_URL_DISK: ${LABRA_HEARTBEAT_URL_DISK:-}
      LABRA_WATCHDOG_URL: ${LABRA_WATCHDOG_URL:-}
    # Read as uid 10001, like database_url: world-readable files inside the 0700 secrets folder.
    secrets: [backup_database_url, restic_password, rclone_conf]
    volumes:
      - files:/data/files:ro
      - backup_cache:/backup/cache
      # The USB disk's mount point on the host. When the disk isn't mounted the folder is
      # empty, so the USB copy fails and alerts while the Drive copy still runs.
      - ${LABRA_BACKUP_USB_DIR:-/mnt/labra-backup}:/backup/usb
    networks: [db, egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    logging: *logging

  # The same job image for scripts/restore.sh and the drill. Only a restore writes the files
  # back, so only it mounts them writable; it loads tables, so it logs in as the owner.
  restore:
    <<: *backup
    environment:
      <<: *backup-env
      LABRA_DATABASE_URL_FILE: /run/secrets/owner_database_url
    secrets: [owner_database_url, restic_password, rclone_conf]
    volumes:
      - files:/data/files
      - backup_cache:/backup/cache
      - ${LABRA_BACKUP_USB_DIR:-/mnt/labra-backup}:/backup/usb

networks:
  db:
    internal: true
  # Internet access for the backup job only (Google Drive, the heartbeat monitor).
  egress:
  # Between the proxy and web only. Web has no way to the internet: a flaw in the app can't send
  # data out or fetch anything in.
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${LABRA_EDGE_SUBNET:-172.30.0.0/24}
  # The proxy's published ports, and the internet for it and the tunnels.
  public:

volumes:
  pgdata:
  files:
  exports:
  caddy_data:
  caddy_config:
  tailscale_state:
  netbird_state:
  backup_cache:

secrets:
  db_password:
    file: ${LABRA_SECRETS_DIR:-./secrets}/db_password
  owner_database_url:
    file: ${LABRA_SECRETS_DIR:-./secrets}/owner_database_url
  database_url:
    file: ${LABRA_SECRETS_DIR:-./secrets}/database_url
  backup_database_url:
    file: ${LABRA_SECRETS_DIR:-./secrets}/backup_database_url
  restic_password:
    file: ${LABRA_SECRETS_DIR:-./secrets}/restic_password
  rclone_conf:
    file: ${LABRA_SECRETS_DIR:-./secrets}/rclone.conf
