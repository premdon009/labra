name: deps-weekly

# Refreshes the release columns of docs/DEPENDENCIES.md from PyPI and prints status changes
# for a maintainer to confirm. It never commits; copy the changes in a normal PR.
on:
  schedule:
    - cron: "30 3 * * 1" # Monday 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv run python scripts/audit_deps.py --refresh
      - run: git diff --stat -- docs/DEPENDENCIES.md && git diff -- docs/DEPENDENCIES.md
      - run: uv run python scripts/audit_deps.py --check
