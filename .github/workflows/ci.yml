name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA, with the tag in a comment; scripts/audit_deps.py --check
# fails on a tag or branch reference.
jobs:
  gate:
    # The PDF snapshot goldens were written on Ubuntu 26.04 (docs/dev/setup.md).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the tracker and manual gates compare the branch with master
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # WeasyPrint's libraries, the same list as the Dockerfile's (tests/test_tooling.py checks).
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fontconfig
      - run: uv run playwright install --with-deps chromium # for the browser test
      - run: scripts/ci_local.sh
        env:
          LABRA_CI_LOGS: ${{ runner.temp }}/ci-logs # outside the checkout, so the gate never scans it
      # Each stage's log, pytest.txt and junit.xml, for finding what failed.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-logs
          path: ${{ runner.temp }}/ci-logs
          retention-days: 14

  # Both architectures build on every change, so an arm64 mini PC never meets a broken image.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
