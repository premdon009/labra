name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. Every other run (master, the
# schedule, a manual start) gets a group of its own: a shared group would let a newer pending
# run replace an older one, and master runs must all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA, with the tag in a comment; scripts/audit_deps.py --check
# fails on a tag or branch reference.
jobs:
  gate:
    # The PDF snapshot goldens were written on Ubuntu 26.04 (docs/dev/setup.md).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the tracker and manual gates compare the branch with master
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # WeasyPrint's libraries, the same list as the Dockerfile's (tests/test_tooling.py checks).
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fontconfig
      - run: uv run playwright install --with-deps chromium # for the browser test
      - run: scripts/install_ci_tools.sh # gitleaks, osv-scanner, git-cliff, shellcheck
      # The banned-terms list comes from a secret, so the names stay out of the repository.
      - run: printf '%s' "$TERMS" >"$RUNNER_TEMP/banned-terms.txt"
        env:
          TERMS: ${{ secrets.BANNED_TERMS }}
      # --strict: a stage that couldn't be checked (WARN) fails the run. A fork's pull request
      # gets no secrets, so there the banned-terms check skips.
      - run: scripts/ci_local.sh --strict
        env:
          LABRA_BANNED_TERMS: ${{ runner.temp }}/banned-terms.txt
          LABRA_BANNED_TERMS_OPTIONAL: "1"
          LABRA_CI_LOGS: ${{ runner.temp }}/ci-logs # outside the checkout, so the gate never scans it
      # Each stage's log, pytest.txt and junit.xml, for finding what failed.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-logs
          path: ${{ runner.temp }}/ci-logs
          retention-days: 14

  # Both architectures build on every change, so an arm64 mini PC never meets a broken image.
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
