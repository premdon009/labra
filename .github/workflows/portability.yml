name: portability
# The same image and Compose file on every supported runtime and builder (ADR-0009,
# docs/dev/runtimes.md). Ubuntu 26.04 for Podman 5; 24.04's Podman 4.9 can't resolve names on
# internal networks. The outside-postgres job runs the tests against a PostgreSQL server that
# Labra didn't start (docs/dev/services.md).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - compose*.yaml
      - Caddyfile
      - deploy/**
      - scripts/build_image.sh
      - scripts/check_image.sh
      - scripts/stack_smoke.sh
      - scripts/compare_runtimes.sh
      - scripts/runtime_bench.py
      - src/labra/core/dialect.py
      - src/labra/migrations/**
      - tests/conftest.py
      - tests/test_db_dialect.py
      - .github/workflows/portability.yml
permissions:
  contents: read
env:
  NERDCTL_VERSION: 2.4.1
  NERDCTL_SHA256: ff018f11ac2f1354bf7b3aaaca6e0b52d81139c746a89134744d0b7be3a0e62f
jobs:
  runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker-caddy
            run: scripts/compare_runtimes.sh --runtimes docker --builders "" --out results
          - name: docker-nginx
            run: |
              scripts/build_image.sh --builder docker
              scripts/stack_smoke.sh --compose "docker compose" --proxy nginx
          - name: podman
            install: podman
            run: |
              systemctl --user enable --now podman.socket
              scripts/compare_runtimes.sh --runtimes podman --builders "" --out results
          - name: podman-nginx
            install: podman
            run: |
              systemctl --user enable --now podman.socket
              scripts/build_image.sh --builder podman
              scripts/stack_smoke.sh --compose "podman compose" --proxy nginx
          - name: podman-compose
            install: podman podman-compose
            run: |
              scripts/build_image.sh --builder podman
              scripts/stack_smoke.sh --compose podman-compose
          - name: nerdctl
            install: uidmap
            run: |
              tarball=nerdctl-full-$NERDCTL_VERSION-linux-amd64.tar.gz
              curl -fsSLO "https://github.com/containerd/nerdctl/releases/download/v$NERDCTL_VERSION/$tarball"
              echo "$NERDCTL_SHA256  $tarball" | sha256sum -c
              sudo tar -C /usr/local -xzf "$tarball"
              # Ubuntu's AppArmor refuses unprivileged user namespaces to any program without a
              # profile that allows them; RootlessKit needs one.
              sudo tee /etc/apparmor.d/usr.local.bin.rootlesskit >/dev/null <<'EOT'
              abi <abi/4.0>,
              include <tunables/global>
              /usr/local/bin/rootlesskit flags=(unconfined) {
                userns,
                include if exists <local/usr.local.bin.rootlesskit>
              }
              EOT
              sudo systemctl restart apparmor.service
              containerd-rootless-setuptool.sh install
              scripts/compare_runtimes.sh --runtimes nerdctl --builders "" --out results
          - name: incus
            install: incus
            run: |
              sudo incus admin init --minimal
              # Docker's firewall drops forwarded traffic from other bridges.
              sudo iptables -I DOCKER-USER -j ACCEPT
              sudo usermod -aG incus-admin "$USER"
              sg incus-admin -c 'scripts/compare_runtimes.sh --runtimes incus --builders "" --out results'
          - name: builders
            install: podman buildah
            run: scripts/compare_runtimes.sh --runtimes "" --builders "docker podman buildah kaniko" --out results
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: matrix.install
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.install }}
      - run: ${{ matrix.run }}
      - if: always()
        run: if [ -f results/results.md ]; then cat results/results.md >>"$GITHUB_STEP_SUMMARY"; fi

  outside-postgres:
    runs-on: ubuntu-26.04 # the OS the PDF snapshot goldens were written on
    timeout-minutes: 30
    services:
      postgres:
        image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: labra_test
          POSTGRES_HOST_AUTH_METHOD: trust # a throwaway server on the runner only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d labra_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # With this set, a database test that can't reach the server fails instead of skipping.
      LABRA_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/labra_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # WeasyPrint's libraries, the same list as the Dockerfile's (tests/test_tooling.py checks).
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fontconfig
      - run: uv run pytest -q -rs -m "db and not e2e" -n auto
