name: release

# A version tag builds amd64 and arm64 images on GHCR, the app and the backup job
# (docs/dev/releasing.md).
#   v0.1.0rc1   ->  0.1.0rc1
#   v0.1.0      ->  0.1.0, 0.1 and release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Tag matches pyproject.toml
        run: |
          version=$(grep -m1 -E '^version = ' pyproject.toml | cut -d'"' -f2)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: uv run python scripts/check_tracker.py --tag "$GITHUB_REF_NAME"
      - run: uv run playwright install --with-deps chromium # for the browser test
      - run: scripts/ci_local.sh

  images:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Image tags
        id: tags
        run: |
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          for name in "" -backup; do
            tags=$image$name:$version
            if [[ $version =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              tags+=",$image$name:${BASH_REMATCH[1]}.${BASH_REMATCH[2]},$image$name:release"
            fi
            echo "tags${name//-/_}=$tags" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
      # The one-shot backup job (ADR-0013), built from its own folder.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: deploy/backup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags_backup }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
