name: release

# A version tag builds amd64 and arm64 images on GHCR, the app and the backup job
# (docs/dev/releasing.md).
#   v0.1.0rc1   ->  0.1.0rc1
#   v0.1.0      ->  0.1.0, 0.1 and release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Tag matches pyproject.toml
        run: |
          version=$(grep -m1 -E '^version = ' pyproject.toml | cut -d'"' -f2)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: uv run python scripts/check_tracker.py --tag "$GITHUB_REF_NAME"
      - run: uv run playwright install --with-deps chromium # for the browser test
      - run: scripts/install_ci_tools.sh # gitleaks, osv-scanner, git-cliff, shellcheck
      # --strict: a stage that couldn't be checked (WARN) fails the release.
      - run: scripts/ci_local.sh --strict
      # The tagged commit's image through restore, upgrade and rollback before anything is pushed.
      - run: scripts/ci_local.sh --strict --only stack

  images:
    needs: gate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Image tags
        id: tags
        run: |
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          for name in "" -backup; do
            tags=$image$name:$version
            if [[ $version =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              tags+=",$image$name:${BASH_REMATCH[1]}.${BASH_REMATCH[2]},$image$name:release"
            fi
            echo "tags${name//-/_}=$tags" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
      # The one-shot backup job (ADR-0013), built from its own folder.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/backup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags_backup }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
