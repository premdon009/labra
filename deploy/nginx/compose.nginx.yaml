# nginx in place of Caddy, for hosts where Caddy can't be used. Same ports, same behaviour.
#
#   docker compose -f compose.yaml -f deploy/nginx/compose.nginx.yaml up -d
#
# nginx has no certificate authority of its own: put labra.crt and labra.key in
# ${LABRA_SECRETS_DIR:-./secrets}/tls/ first (docs/dev/running-the-stack.md). Paths are
# relative to the project directory, where compose.yaml is.

services:
  proxy:
    image: docker.io/library/nginx:1.30@sha256:9bf97bd7714f5e24c1ccd545ecb9eb5435cb6d109c97cebb15e7e455e0239edb
    volumes:
      - ./deploy/nginx/labra.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/labra-proxy.conf:/etc/nginx/labra-proxy.conf:ro
      - ${LABRA_SECRETS_DIR:-./secrets}/tls:/etc/nginx/tls:ro
