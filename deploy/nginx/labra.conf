# nginx in place of Caddy. The app sets CSP and the other security headers itself; the proxy
# adds HSTS on HTTPS and keeps /metrics off the network, as the Caddyfile does.

server_tokens off;
# Caddy sets no upload limit; nginx's default of 1 MB would refuse scanned documents.
client_max_body_size 50m;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Main-lab PCs on the LAN: plain HTTP only redirects.
server {
    listen 80 default_server;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate /etc/nginx/tls/labra.crt;
    ssl_certificate_key /etc/nginx/tls/labra.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/labra-proxy.conf;
}

# Branches, through the tunnel, which ends TLS itself. Not published on the host.
server {
    listen 8080;
    include /etc/nginx/labra-proxy.conf;
}
